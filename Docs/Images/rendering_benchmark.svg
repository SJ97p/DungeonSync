<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DungeonSync Release immediate rendering benchmark</title>
  <desc id="desc">CPU submission and GPU time comparison between instanced and per-instance sprite drawing.</desc>
  <rect width="1200" height="720" fill="#0b1220"/>
  <text x="60" y="58" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">Release + Immediate Sprite Submission</text>
  <text x="60" y="88" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="16">Lower is better · 2s warmup · 3s minimum measurement · 600 retained samples</text>

  <rect x="60" y="120" width="520" height="430" rx="12" fill="#111c2f" stroke="#24324a"/>
  <text x="90" y="160" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="21" font-weight="600">CPU command submission (ms)</text>
  <line x1="190" y1="190" x2="190" y2="495" stroke="#475569"/>
  <line x1="190" y1="495" x2="550" y2="495" stroke="#475569"/>
  <text x="105" y="242" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="16">1,000</text>
  <text x="105" y="342" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="16">3,000</text>
  <text x="95" y="442" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="16">10,000</text>
  <rect x="190" y="212" width="24" height="22" fill="#38bdf8"/><rect x="190" y="238" width="53" height="22" fill="#fb7185"/>
  <rect x="190" y="312" width="64" height="22" fill="#38bdf8"/><rect x="190" y="338" width="133" height="22" fill="#fb7185"/>
  <rect x="190" y="412" width="172" height="22" fill="#38bdf8"/><rect x="190" y="438" width="350" height="22" fill="#fb7185"/>
  <text x="222" y="229" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">0.0054</text><text x="251" y="255" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">0.0118</text>
  <text x="262" y="329" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">0.0143</text><text x="331" y="355" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">0.0295</text>
  <text x="370" y="429" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">0.0382</text><text x="485" y="455" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">0.0778</text>

  <rect x="620" y="120" width="520" height="430" rx="12" fill="#111c2f" stroke="#24324a"/>
  <text x="650" y="160" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="21" font-weight="600">GPU elapsed time (ms)</text>
  <line x1="750" y1="190" x2="750" y2="495" stroke="#475569"/>
  <line x1="750" y1="495" x2="1110" y2="495" stroke="#475569"/>
  <text x="665" y="242" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="16">1,000</text>
  <text x="665" y="342" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="16">3,000</text>
  <text x="655" y="442" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="16">10,000</text>
  <rect x="750" y="212" width="96" height="22" fill="#38bdf8"/><rect x="750" y="238" width="120" height="22" fill="#fb7185"/>
  <rect x="750" y="312" width="144" height="22" fill="#38bdf8"/><rect x="750" y="338" width="178" height="22" fill="#fb7185"/>
  <rect x="750" y="412" width="182" height="22" fill="#38bdf8"/><rect x="750" y="438" width="341" height="22" fill="#fb7185"/>
  <text x="854" y="229" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">0.0345</text><text x="878" y="255" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">0.0433</text>
  <text x="902" y="329" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">0.0519</text><text x="936" y="355" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">0.0642</text>
  <text x="940" y="429" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">0.0657</text><text x="1035" y="455" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">0.1232</text>

  <rect x="60" y="580" width="1080" height="90" rx="12" fill="#111c2f" stroke="#24324a"/>
  <rect x="90" y="606" width="18" height="18" fill="#38bdf8"/><text x="120" y="621" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="16">Instanced batch</text>
  <rect x="270" y="606" width="18" height="18" fill="#fb7185"/><text x="300" y="621" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="16">Per-instance draws</text>
  <text x="90" y="650" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600">10,000 sprites: 10,002 → 3 draw calls · CPU −50.9% · GPU −46.7%</text>
</svg>
